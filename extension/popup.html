<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">

  <!-- Gör popupen responsiv -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titel för extensionen -->
  <title>Website QA System</title>

  <!-- Kopplar popupens CSS -->
  <link rel="stylesheet" href="src/popup.css">
</head>

<body>

  <!-- Huvudcontainer för extensionen -->
  <main class="container">

    <!-- Titel -->
    <h1>Website QA System</h1>

    <!-- Kort beskrivning -->
    <p class="description">
      Automatiserad QA-granskning av webbplatser.
    </p>


    <!-- ========================= -->
    <!-- ENKEL WEBBPLATS-SKANNING -->
    <!-- ========================= -->

    <!-- Etikett för URL-fältet -->
    <label for="url">
      Website URL
    </label>

    <!-- Fält där användaren skriver in webbplatsen -->
    <input
      id="url"
      type="url"
      placeholder="https://example.se"
    >

    <!-- Knapp för vanlig QA-skanning -->
    <button id="scanButton">
      Start QA
    </button>


    <!-- ========================= -->
    <!-- CSV-SKANNING -->
    <!-- ========================= -->

    <!-- Rubrik för CSV-funktionen -->
    <h2>CSV QA Scan</h2>

    <!-- Beskrivning av CSV-funktionen -->
    <p class="csv-description">
      Välj en CSV-fil med webbplatser som ska testas.
    </p>

    <!-- Filväljare för CSV -->
    <input
      id="csvFile"
      type="file"
      accept=".csv"
    >

    <!-- Knapp för att starta CSV-skanning -->
    <button
      id="csvScanButton"
      type="button"
    >
      Start CSV QA
    </button>


    <!-- Område för progressbaren -->
    <div
      id="progressContainer"
      class="progress-container"
      hidden
    >

      <!-- Rad som visar status och procent -->
      <div class="progress-info">

        <!-- Statusmeddelande -->
        <span id="progressStatus">
          QA-skanning pågår...
        </span>

        <!-- Procent -->
        <span id="progressPercent">
          0%
        </span>

      </div>

      <!-- Bakgrund till progressbaren -->
      <div class="progress-bar">

        <!-- Själva progressen -->
        <div
          id="progressFill"
          class="progress-fill"
        ></div>

      </div>

    </div>


    <!-- Område för statusmeddelanden -->
    <div
      id="status"
      class="status"
    ></div>


    <!-- Område där QA-resultatet visas -->
    <div
      id="results"
      class="results"
    ></div>


    <!-- ========================= -->
<!-- PDF-FUNKTIONER -->
<!-- ========================= -->

<!-- Knapp för att öppna PDF-rapporten -->
<button
  id="pdfButton"
  class="pdf-button"
  type="button"
  hidden
>
  Öppna PDF-rapport
</button>

<!-- Knapp för att ladda ner PDF-rapporten -->
<button
  id="downloadPdfButton"
  class="pdf-button"
  type="button"
  hidden
>
  Ladda ner PDF-rapport
</button>



  <!-- Kopplar popupens JavaScript -->
  <script src="src/popup.js"></script>

</body>
</html>
